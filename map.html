<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Map – MyCommunity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    .header { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); z-index: 1000; }
    .fab { position: fixed; bottom: 24px; right: 24px; z-index: 1000; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); } 70% { box-shadow: 0 0 0 15px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
  </style>
</head>
<body>

  <div class="header text-white py-3 px-4 flex justify-between items-center">
    <a href="index.html" class="btn btn-circle btn-ghost">←</a>
    <h1 class="text-xl font-bold">Live Issues Map</h1>
    <div class="flex items-center gap-2">
      <div id="auth-section-map" class="flex items-center gap-3 mr-2"></div>
      <label class="swap swap-rotate btn btn-circle btn-ghost">
        <input type="checkbox" class="theme-controller" id="theme-toggle" />
        <svg class="swap-on w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 6.5A5.5 5.5 0 1 0 17.5 12 5.51 5.51 0 0 0 12 6.5Zm0 9A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
        <svg class="swap-off w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2 1 1 0 0 0-1.33-1.13A10.14 10.14 0 1 0 22 14.05 1 1 0 0 0 21.64 13Z"/></svg>
      </label>
    </div>
  </div>

  <button onclick="document.getElementById('report_modal').showModal()" class="fab btn btn-circle btn-lg btn-primary shadow-2xl text-3xl">+</button>
  <div id="map"></div>

  <dialog id="report_modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
      <h3 class="font-bold text-2xl mb-6">Report New Issue</h3>
      <form onsubmit="handleReport(event)">
        <input id="title" type="text" placeholder="Title..." class="input input-bordered w-full mb-4" required />
        <textarea id="desc" class="textarea textarea-bordered w-full h-32 mb-4" placeholder="Describe..." required></textarea>
        <div class="flex gap-3">
          <button type="submit" class="btn btn-primary flex-1">Submit</button>
          <button type="button" onclick="document.getElementById('report_modal').close()" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
      <form method="dialog"><button class="btn btn-circle btn-ghost absolute top-4 right-4">X</button></form>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // DUMMY DATA GENERATOR
    (function() {
      const existingReports = localStorage.getItem("allReports");
      if (!existingReports || JSON.parse(existingReports).length === 0) {
        const titles = ["Large pothole on Main Street","Broken streetlight near school","Overflowing trash bin at Labadi","Damaged sidewalk","Graffiti on wall","Abandoned vehicle","Fallen tree blocking path","Leaking fire hydrant","Broken playground equipment","Illegal dumping","Street sign down","Cracked road surface","Blocked storm drain","Dangerous intersection","Vandalized park bench","Missing manhole cover","Overgrown vegetation","Damaged bus shelter","Street flooding","Broken water fountain","Faded crossing markings","Construction noise","Stray dogs","Poor street lighting","Illegal parking","Damaged speed bump","Broken traffic light","Uncollected garbage","Mosquito breeding pothole","Damaged road signs","Broken fence","Flooded gutter","Cracked pavement","Non-functioning signal","Damaged toilet facility","Vendors blocking walkway","Broken bench","Overhanging wires","Erosion damage","Collapsed wall","Broken street sign","Pothole cluster","Damaged curb","Leaking pipe","Rusted playground slide","Blocked culvert","Faded lane markings","Damaged phone booth","Broken shelter glass","Overgrown weeds"];
        const descriptions = ["This has been a problem for weeks and is getting worse. Dangerous for everyone.","Urgent attention needed as it poses safety risk to residents.","Please fix ASAP. Many complaints filed.","Affecting quality of life in neighborhood.","Been reporting for months. Still not fixed.","Children play here. Needs immediate attention.","Multiple injury reports from this issue.","Problem occurs during rush hour.","Major health and safety concern.","Local businesses affected by this.","Elderly residents at risk.","Needs city council priority.","Emergency access may be blocked.","Getting progressively worse daily.","Community willing to help if needed."];
        const statuses = ["urgent","warning","warning","warning"];
        const times = ["Just now","5 mins ago","1 hour ago","3 hours ago","Yesterday","2 days ago","1 week ago","2 weeks ago"];
        const locations = [{name:"Osu",lat:5.5558,lng:-0.1826},{name:"Labadi",lat:5.5825,lng:-0.1547},{name:"East Legon",lat:5.6378,lng:-0.1522},{name:"Madina",lat:5.6797,lng:-0.1669},{name:"Kaneshie",lat:5.5686,lng:-0.2347}];
        const users = [{name:"Kwame Mensah",email:"kwame@gmail.com",avatar:"https://api.dicebear.com/7.x/avataaars/svg?seed=kwame"},{name:"Ama Asante",email:"ama@gmail.com",avatar:"https://api.dicebear.com/7.x/avataaars/svg?seed=ama"},{name:"Kofi Boateng",email:"kofi@gmail.com",avatar:"https://api.dicebear.com/7.x/avataaars/svg?seed=kofi"}];
        const images = ["https://images.unsplash.com/photo-1625481506955-e5db7b9c9d48?w=600","https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=600","https://images.unsplash.com/photo-1616422285623-13ff0162193c?w=600",null,null];
        
        const reports = [];
        for (let i = 0; i < 50; i++) {
          const user = users[Math.floor(Math.random() * users.length)];
          const loc = locations[Math.floor(Math.random() * locations.length)];
          reports.push({
            id: `report_${Date.now()}_${i}`,
            title: titles[i % titles.length],
            desc: descriptions[Math.floor(Math.random() * descriptions.length)],
            image: images[Math.floor(Math.random() * images.length)],
            lat: loc.lat + (Math.random()-0.5)*0.02,
            lng: loc.lng + (Math.random()-0.5)*0.02,
            time: times[Math.floor(Math.random() * times.length)],
            upvotes: Math.floor(Math.random() * 50),
            status: statuses[Math.floor(Math.random() * statuses.length)],
            userId: user.email,
            userName: user.name
          });
        }
        localStorage.setItem("allReports", JSON.stringify(reports));
      }
      if (!localStorage.getItem("user")) {
        localStorage.setItem("user", JSON.stringify({name:"Demo User",email:"demo@mycommunity.com",avatar:"https://api.dicebear.com/7.x/avataaars/svg?seed=demo"}));
      }
    })();

    const html = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    html.setAttribute("data-theme", saved);
    if (toggle) toggle.checked = saved === "dark";
    toggle?.addEventListener("change", () => {
      const t = toggle.checked ? "dark" : "light";
      html.setAttribute("data-theme", t);
      localStorage.setItem("theme", t);
      updateTiles(t);
    });

    let map, userLoc;
    const light = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const dark = 'https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png';
    let layer = L.tileLayer(light, { attribution: '&copy; OpenStreetMap' });

    function updateTiles(theme) {
      if (layer) map.removeLayer(layer);
      layer = L.tileLayer(theme === 'dark' ? dark : light, { attribution: theme === 'dark' ? '&copy; CartoDB' : '&copy; OpenStreetMap' });
      layer.addTo(map);
    }

    function handleReport(e) {
      e.preventDefault();
      if (!userLoc) return alert("Getting your location...");
      const title = document.getElementById("title").value;
      const desc = document.getElementById("desc").value;
      const icon = L.divIcon({ html: `<div style="background:#10b981;width:16px;height:16px;border-radius:50%;border:4px solid white;"></div>`, iconSize: [24,24], iconAnchor: [12,12] });
      L.marker(userLoc, { icon }).addTo(map).bindPopup(`<b>${title}</b><br>${desc}<br><span class="badge badge-success">New</span>`).openPopup();
      map.panTo(userLoc);
      document.getElementById('report_modal').close();
      e.target.reset();
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Update navbar with auth buttons
      const user = JSON.parse(localStorage.getItem("user"));
      const authSection = document.getElementById("auth-section-map");
      if (user) {
        authSection.innerHTML = `
          <img src="${user.avatar}" class="w-8 h-8 rounded-full ring ring-white ring-offset-2" />
          <span class="text-sm hidden md:inline">${user.name.split(" ")[0]}</span>
        `;
      } else {
        authSection.innerHTML = `
          <a href="login.html" class="btn btn-ghost btn-xs text-white">Login</a>
          <a href="register.html" class="btn btn-primary btn-xs">Register</a>
        `;
      }

      map = L.map('map').setView([5.6037, -0.1870], 13);
      layer.addTo(map);

      const urgent = L.divIcon({ html: `<div style="background:#ef4444;width:16px;height:16px;border-radius:50%;border:4px solid white;"></div>`, iconSize: [24,24], iconAnchor: [12,12] });
      const warning = L.divIcon({ html: `<div style="background:#f59e0b;width:16px;height:16px;border-radius:50%;border:4px solid white;"></div>`, iconSize: [24,24], iconAnchor: [12,12] });

      // Load all reports from localStorage and add to map
      const allReports = JSON.parse(localStorage.getItem("allReports") || "[]");
      allReports.forEach(r => {
        if (r.lat && r.lng) {
          const icon = r.status === 'urgent' ? urgent : warning;
          const popupContent = `
            ${r.image ? `<img src="${r.image}" style="width:100%;max-width:200px;border-radius:8px;margin-bottom:8px;">` : ''}
            <b>${r.title}</b><br>
            <p style="font-size:12px;margin:4px 0;">${r.desc}</p>
            <div style="font-size:11px;color:#666;margin-top:4px;">
              <span class="badge ${r.status === 'urgent' ? 'badge-error' : 'badge-warning'}">${r.status === 'urgent' ? 'Urgent' : 'Warning'}</span>
              • ${r.upvotes || 0} upvotes • ${r.time}
            </div>
          `;
          L.marker([r.lat, r.lng], { icon }).addTo(map).bindPopup(popupContent);
        }
      });

      navigator.geolocation.getCurrentPosition(pos => {
        userLoc = [pos.coords.latitude, pos.coords.longitude];
        map.setView(userLoc, 15);
        L.marker(userLoc, { icon: L.divIcon({ html: `<div style="background:#3b82f6;width:14px;height:14px;border-radius:50%;border:4px solid white;animation:pulse 2s infinite;"></div>`, iconSize: [22,22], iconAnchor: [11,11] }) })
          .addTo(map).bindPopup("You are here").openPopup();
      });
    });
  </script>
</body>
</html>
