<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – MyCommunity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center px-4">
  <div class="card w-full max-w-md bg-base-100 shadow-2xl">
    <div class="card-body">
      <div class="text-center mb-6">
        <img src="images/logo.png" class="w-20 h-20 mx-auto rounded-lg" />
        <h1 class="text-3xl font-bold mt-4">Join MyCommunity</h1>
        <p class="text-base-content/70">Help fix your neighborhood together</p>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="flex flex-col items-center mb-6">
          <img id="preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=newuser" class="w-24 h-24 rounded-full ring ring-primary ring-offset-4 ring-offset-base-100" />
          <label class="btn btn-sm btn-ghost mt-4">
            Upload Photo
            <input type="file" id="avatar" accept="image/*" onchange="previewImage(event)" class="hidden" />
          </label>
        </div>

        <input type="text" id="name" placeholder="Full Name" class="input input-bordered w-full mb-4" required />
        <input type="email" id="email" placeholder="Email" class="input input-bordered w-full mb-4" required />
        <input type="password" id="password" placeholder="Password" class="input input-bordered w-full mb-6" required />

        <button type="submit" class="btn btn-primary w-full">Create Account</button>
      </form>

      <div class="text-center mt-6">
        <p>Already have an account? <a href="login.html" class="link link-primary font-bold">Login</a></p>
      </div>
    </div>
  </div>

  <script>
    function previewImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById("preview").src = reader.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const avatarInput = document.getElementById("avatar");
      const avatar = avatarInput.files[0] ? URL.createObjectURL(avatarInput.files[0]) : `https://api.dicebear.com/7.x/avataaars/svg?seed=${email}`;

      const user = { name, email, avatar };
      localStorage.setItem("user", JSON.stringify(user));
      alert("Account created! Welcome " + name.split(" ")[0] + "!");
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
